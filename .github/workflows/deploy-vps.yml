name: Deploy JUST TECH SERVICES Panel to VPS

on:
  workflow_dispatch:
    inputs:
      panel_domain:
        description: "Panel domain (or leave blank to use VPS_HOST)"
        required: false
        default: ""
        type: string
      slowdns_ns_domain:
        description: "SlowDNS nameserver domain"
        required: false
        default: ""
        type: string
      deploy_vpn_stack:
        description: "Install/update the VPN stack"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      enable_ssl:
        description: "Enable Let's Encrypt TLS for a domain"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

concurrency:
  group: jts-vps-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy the panel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and verify the project
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run build

      - name: Validate VPS connection and administrator settings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          JTS_SUPERADMIN_EMAIL: ${{ secrets.JTS_SUPERADMIN_EMAIL }}
          JTS_SUPERADMIN_PASSWORD: ${{ secrets.JTS_SUPERADMIN_PASSWORD }}
          PANEL_DOMAIN: ${{ inputs.panel_domain || vars.JTS_PANEL_DOMAIN || secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_SSH_KEY VPS_KNOWN_HOSTS JTS_SUPERADMIN_EMAIL JTS_SUPERADMIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions secret is missing: ${name}"
              exit 1
            fi
          done
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::VPS_HOST is invalid."; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "::error::VPS_USER is invalid."; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] && (( VPS_PORT >= 1 && VPS_PORT <= 65535 )) || { echo "::error::VPS_PORT is invalid."; exit 1; }
          [[ "$VPS_KNOWN_HOSTS" == *"$VPS_HOST"* ]] || { echo "::error::VPS_KNOWN_HOSTS must contain the configured host."; exit 1; }
          [[ "$JTS_SUPERADMIN_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || { echo "::error::JTS_SUPERADMIN_EMAIL is invalid."; exit 1; }
          [[ "${#JTS_SUPERADMIN_PASSWORD}" -ge 16 && "$JTS_SUPERADMIN_PASSWORD" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::Use a 16+ character password containing only letters, numbers, underscore, or hyphen."; exit 1; }
          [[ "$PANEL_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::Panel domain is invalid."; exit 1; }

      - name: Prepare release, SSH trust, and temporary bootstrap files
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          JTS_SUPERADMIN_EMAIL: ${{ secrets.JTS_SUPERADMIN_EMAIL }}
          JTS_SUPERADMIN_PASSWORD: ${{ secrets.JTS_SUPERADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/jts_vps_key"
          chmod 600 "$HOME/.ssh/jts_vps_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          mkdir -m 700 -p "$RUNNER_TEMP/jts-deploy/bootstrap"
          git archive --format=tar.gz --prefix=JUST_TECH_SERVICES_PANEL_FINAL/ "$GITHUB_SHA" > "$RUNNER_TEMP/jts-deploy/release.tar.gz"
          printf '%s' "$JTS_SUPERADMIN_EMAIL" | base64 -w 0 > "$RUNNER_TEMP/jts-deploy/bootstrap/admin-email.b64"
          printf '%s' "$JTS_SUPERADMIN_PASSWORD" | base64 -w 0 > "$RUNNER_TEMP/jts-deploy/bootstrap/admin-password.b64"
          chmod 600 "$RUNNER_TEMP/jts-deploy/bootstrap/"*

      - name: Upload release and bootstrap files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -euo pipefail
          REMOTE_DIR="/tmp/jts-panel-$GITHUB_SHA"
          ssh -i "$HOME/.ssh/jts_vps_key" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$VPS_USER@$VPS_HOST" "mkdir -m 700 -p '$REMOTE_DIR'"
          scp -i "$HOME/.ssh/jts_vps_key" -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$RUNNER_TEMP/jts-deploy/release.tar.gz" \
            "$VPS_USER@$VPS_HOST:$REMOTE_DIR/"
          scp -i "$HOME/.ssh/jts_vps_key" -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -r \
            "$RUNNER_TEMP/jts-deploy/bootstrap" \
            "$VPS_USER@$VPS_HOST:$REMOTE_DIR/"

      - name: Install panel on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          PANEL_DOMAIN: ${{ inputs.panel_domain || vars.JTS_PANEL_DOMAIN || secrets.VPS_HOST }}
          SLOWDNS_NS_DOMAIN: ${{ inputs.slowdns_ns_domain || vars.JTS_SLOWDNS_NS_DOMAIN || 'sdns1.justtechservices.xyz' }}
          DEPLOY_VPN_STACK: ${{ inputs.deploy_vpn_stack || 'false' }}
          ENABLE_SSL: ${{ inputs.enable_ssl || 'true' }}
        run: |
          set -euo pipefail
          [[ "$PANEL_DOMAIN" =~ ^[A-Za-z0-9.-]+$ && "$SLOWDNS_NS_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::A domain value is invalid."; exit 1; }
          [[ "$DEPLOY_VPN_STACK" == "true" || "$DEPLOY_VPN_STACK" == "false" ]] || { echo "::error::VPN option is invalid."; exit 1; }
          [[ "$ENABLE_SSL" == "true" || "$ENABLE_SSL" == "false" ]] || { echo "::error::SSL option is invalid."; exit 1; }
          REMOTE_DIR="/tmp/jts-panel-$GITHUB_SHA"
          REMOTE_SCRIPT="$REMOTE_DIR/release.tar.gz"
          ssh -i "$HOME/.ssh/jts_vps_key" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$VPS_USER@$VPS_HOST" \
            "sudo -n env JTS_INSTALL_DIR='/opt/justtech-panel' JTS_PANEL_DOMAIN='$PANEL_DOMAIN' JTS_SLOWDNS_NS_DOMAIN='$SLOWDNS_NS_DOMAIN' JTS_DEPLOY_VPN_STACK='$DEPLOY_VPN_STACK' JTS_ENABLE_SSL='$ENABLE_SSL' bash -c 'tar -xzf \"$REMOTE_SCRIPT\" -C /tmp; bash /tmp/JUST_TECH_SERVICES_PANEL_FINAL/deliverable/deploy-scripts/vps-deploy-panel-and-vpn.sh \"$REMOTE_SCRIPT\" \"$REMOTE_DIR/bootstrap\"'"

      - name: Remove temporary files from VPS and runner
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          if [[ -n "${VPS_HOST:-}" ]]; then
            REMOTE_DIR="/tmp/jts-panel-$GITHUB_SHA"
            ssh -i "$HOME/.ssh/jts_vps_key" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$VPS_USER@$VPS_HOST" "rm -rf '$REMOTE_DIR' /tmp/JUST_TECH_SERVICES_PANEL_FINAL" || true
          fi
          rm -rf "$RUNNER_TEMP/jts-deploy" "$HOME/.ssh/jts_vps_key"
